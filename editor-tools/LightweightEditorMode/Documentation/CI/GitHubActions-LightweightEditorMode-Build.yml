name: Lightweight Editor Mode Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Plugins/LightweightEditorMode/**"
      - "PluginProject.uproject"

jobs:
  build-plugin:
    name: Build editor target
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Unreal Engine path
        shell: pwsh
        run: |
          Write-Host "Set UE_ROOT to the Unreal Engine installation used by your CI image."
          Write-Host "Example: D:\\Engines\\UE_5.4"

      - name: Build editor target
        shell: pwsh
        run: |
          if (-not $env:UE_ROOT) {
            throw "UE_ROOT is not set. Configure this workflow for your CI image."
          }

          & "$env:UE_ROOT\\Engine\\Build\\BatchFiles\\Build.bat" `
            PluginProjectEditor Win64 Development `
            -Project="$pwd\\PluginProject.uproject" `
            -NoHotReloadFromIDE

      - name: Whitespace check
        shell: bash
        run: |
          git diff --check -- Plugins/LightweightEditorMode PluginProject.uproject

