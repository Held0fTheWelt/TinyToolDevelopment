<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Lightweight Editor Mode workflow overview</title>
  <desc id="desc">Diagram showing the workflow from opening the plugin tab to enabling a profile, editing faster, and disabling the mode to restore editor state.</desc>
  <rect width="1120" height="520" fill="#f6f7f9"/>
  <text x="56" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Lightweight Editor Mode Workflow</text>
  <text x="56" y="91" font-family="Arial, sans-serif" font-size="15" fill="#526070">A reversible editor performance mode for heavy Unreal Engine scenes.</text>

  <g font-family="Arial, sans-serif">
    <rect x="56" y="145" width="220" height="160" rx="8" fill="#ffffff" stroke="#c7ced8"/>
    <text x="82" y="180" font-size="18" font-weight="700" fill="#172033">1. Open Tab</text>
    <text x="82" y="214" font-size="14" fill="#526070">Window &gt; Performance</text>
    <text x="82" y="238" font-size="14" fill="#526070">Lightweight Editor Mode</text>
    <text x="82" y="270" font-size="13" fill="#6b7583">Dockable Slate UI</text>

    <rect x="326" y="145" width="220" height="160" rx="8" fill="#ffffff" stroke="#c7ced8"/>
    <text x="352" y="180" font-size="18" font-weight="700" fill="#172033">2. Pick Profile</text>
    <text x="352" y="214" font-size="14" fill="#526070">Mild, Balanced,</text>
    <text x="352" y="238" font-size="14" fill="#526070">Aggressive, Extreme</text>
    <text x="352" y="270" font-size="13" fill="#6b7583">Editable in settings</text>

    <rect x="596" y="145" width="220" height="160" rx="8" fill="#ffffff" stroke="#c7ced8"/>
    <text x="622" y="180" font-size="18" font-weight="700" fill="#172033">3. Enable</text>
    <text x="622" y="214" font-size="14" fill="#526070">Back up current state</text>
    <text x="622" y="238" font-size="14" fill="#526070">Apply lightweight values</text>
    <text x="622" y="270" font-size="13" fill="#6b7583">CVars, scalability, viewports</text>

    <rect x="866" y="145" width="200" height="160" rx="8" fill="#ffffff" stroke="#c7ced8"/>
    <text x="892" y="180" font-size="18" font-weight="700" fill="#172033">4. Edit Faster</text>
    <text x="892" y="214" font-size="14" fill="#526070">Lower viewport cost</text>
    <text x="892" y="238" font-size="14" fill="#526070">Keep working</text>
    <text x="892" y="270" font-size="13" fill="#6b7583">Disable for final review</text>

    <path d="M276 225 H326" stroke="#627084" stroke-width="3"/>
    <path d="M546 225 H596" stroke="#627084" stroke-width="3"/>
    <path d="M816 225 H866" stroke="#627084" stroke-width="3"/>
    <path d="M318 217 L326 225 L318 233" fill="none" stroke="#627084" stroke-width="3"/>
    <path d="M588 217 L596 225 L588 233" fill="none" stroke="#627084" stroke-width="3"/>
    <path d="M858 217 L866 225 L858 233" fill="none" stroke="#627084" stroke-width="3"/>

    <rect x="214" y="370" width="690" height="74" rx="8" fill="#eaf1ff" stroke="#9bb7e5"/>
    <text x="246" y="403" font-size="17" font-weight="700" fill="#1e365c">Disable Lightweight Mode</text>
    <text x="246" y="429" font-size="14" fill="#40526b">Restores backed-up scalability, CVars, view modes, and realtime states.</text>
  </g>
</svg>

