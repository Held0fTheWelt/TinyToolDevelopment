<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Profile and settings relationship</title>
  <desc id="desc">Diagram showing profiles copied into active settings and then applied by the runtime helper.</desc>
  <rect width="1120" height="520" fill="#fbfbfc"/>
  <text x="56" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Profiles, Active Settings, Runtime Apply</text>
  <text x="56" y="91" font-family="Arial, sans-serif" font-size="15" fill="#526070">The UI copies a selected profile into active settings before applying or refreshing the mode.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="140" width="260" height="245" rx="8" fill="#ffffff" stroke="#c7ced8"/>
    <text x="98" y="176" font-size="19" font-weight="700" fill="#172033">Editable Profiles</text>
    <text x="98" y="212" font-size="14" fill="#526070">MildProfile</text>
    <text x="98" y="240" font-size="14" fill="#526070">BalancedProfile</text>
    <text x="98" y="268" font-size="14" fill="#526070">AggressiveProfile</text>
    <text x="98" y="296" font-size="14" fill="#526070">ExtremeProfile</text>
    <line x1="98" y1="322" x2="300" y2="322" stroke="#d7dce4"/>
    <text x="98" y="350" font-size="13" fill="#6b7583">Project Settings values</text>

    <rect x="430" y="140" width="260" height="245" rx="8" fill="#ffffff" stroke="#c7ced8"/>
    <text x="458" y="176" font-size="19" font-weight="700" fill="#172033">Active Settings</text>
    <text x="458" y="212" font-size="14" fill="#526070">OverallQuality</text>
    <text x="458" y="240" font-size="14" fill="#526070">ScreenPercentage</text>
    <text x="458" y="268" font-size="14" fill="#526070">Feature toggles</text>
    <text x="458" y="296" font-size="14" fill="#526070">Viewport behavior</text>
    <line x1="458" y1="322" x2="660" y2="322" stroke="#d7dce4"/>
    <text x="458" y="350" font-size="13" fill="#6b7583">Runtime source of truth</text>

    <rect x="790" y="140" width="260" height="245" rx="8" fill="#ffffff" stroke="#c7ced8"/>
    <text x="818" y="176" font-size="19" font-weight="700" fill="#172033">Runtime Helper</text>
    <text x="818" y="212" font-size="14" fill="#526070">Back up state</text>
    <text x="818" y="240" font-size="14" fill="#526070">Apply scalability</text>
    <text x="818" y="268" font-size="14" fill="#526070">Set CVars</text>
    <text x="818" y="296" font-size="14" fill="#526070">Update viewports</text>
    <line x1="818" y1="322" x2="1020" y2="322" stroke="#d7dce4"/>
    <text x="818" y="350" font-size="13" fill="#6b7583">FEditorLightweightMode</text>

    <path d="M330 260 H430" stroke="#627084" stroke-width="3"/>
    <path d="M690 260 H790" stroke="#627084" stroke-width="3"/>
    <path d="M422 252 L430 260 L422 268" fill="none" stroke="#627084" stroke-width="3"/>
    <path d="M782 252 L790 260 L782 268" fill="none" stroke="#627084" stroke-width="3"/>

    <text x="350" y="238" font-size="13" fill="#526070">copy</text>
    <text x="710" y="238" font-size="13" fill="#526070">read</text>
  </g>
</svg>

