name: Code Copyright Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  code-copyright-check:
    runs-on: self-hosted
    env:
      UE_EDITOR_CMD: D:\Engines\UE_5.4\Engine\Binaries\Win64\UnrealEditor-Cmd.exe
      UPROJECT: D:\PluginProjectGit\PluginProject.uproject
      REPORT_DIR: Saved\CodeCopyrightEditor\Reports

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run CodeCopyrightCheck commandlet
        shell: pwsh
        run: |
          & "$env:UE_EDITOR_CMD" "$env:UPROJECT" `
            -run=CodeCopyrightCheck `
            -unattended `
            -nop4 `
            -nosplash `
            -NoShaderCompile `
            "-ReportDir=$env:REPORT_DIR"

      - name: Upload copyright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-copyright-reports
          path: ${{ env.REPORT_DIR }}
