<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#202124"/>
  <rect x="48" y="40" width="1184" height="640" rx="8" fill="#2b2d30" stroke="#4a4d52"/>
  <text x="78" y="86" fill="#f1f3f4" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Code Copyright Editor</text>
  <text x="995" y="84" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Next: Scan Files</text>

  <g transform="translate(78 120)">
    <rect width="262" height="86" rx="6" fill="#34373b" stroke="#55595f"/>
    <text x="18" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1</text>
    <text x="52" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Template</text>
    <text x="18" y="64" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">Set legal text and tokens.</text>
  </g>
  <g transform="translate(362 120)">
    <rect width="262" height="86" rx="6" fill="#34373b" stroke="#55595f"/>
    <text x="18" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">2</text>
    <text x="52" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Scan</text>
    <text x="18" y="64" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">Classify without writing.</text>
  </g>
  <g transform="translate(646 120)">
    <rect width="262" height="86" rx="6" fill="#34373b" stroke="#55595f"/>
    <text x="18" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">3</text>
    <text x="52" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Review</text>
    <text x="18" y="64" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">Select intended files.</text>
  </g>
  <g transform="translate(930 120)">
    <rect width="262" height="86" rx="6" fill="#34373b" stroke="#55595f"/>
    <text x="18" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">4</text>
    <text x="52" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Apply</text>
    <text x="18" y="64" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">Rewrite checked files.</text>
  </g>

  <rect x="78" y="250" width="450" height="260" rx="6" fill="#272a2f" stroke="#55595f"/>
  <text x="102" y="286" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Notice Templates</text>
  <rect x="102" y="310" width="402" height="150" rx="4" fill="#1d1f22" stroke="#4f5359"/>
  <text x="122" y="340" fill="#9ecbff" font-family="Consolas, monospace" font-size="15">/* {CopyrightText}</text>
  <text x="122" y="366" fill="#9ecbff" font-family="Consolas, monospace" font-size="15"> * SPDX-FileCopyrightText: {CopyrightText}</text>
  <text x="122" y="392" fill="#9ecbff" font-family="Consolas, monospace" font-size="15"> * SPDX-License-Identifier: {LicenseIdentifier}</text>
  <text x="122" y="418" fill="#d6d6d6" font-family="Consolas, monospace" font-size="15"> * This file is part of "{ProductName}".</text>
  <text x="122" y="444" fill="#d6d6d6" font-family="Consolas, monospace" font-size="15"> */</text>
  <text x="102" y="486" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">Large multiline editor with final line support.</text>

  <rect x="558" y="250" width="634" height="260" rx="6" fill="#272a2f" stroke="#55595f"/>
  <text x="582" y="286" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Actions</text>
  <text x="1014" y="286" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">No scan loaded</text>
  <text x="582" y="326" fill="#f1f3f4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">1. Configure</text>
  <text x="792" y="326" fill="#f1f3f4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">2. Scan and Review</text>
  <text x="1038" y="326" fill="#f1f3f4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">3. Apply</text>
  <rect x="582" y="350" width="86" height="34" rx="4" fill="#3a3d42" stroke="#676b73"/><text x="612" y="372" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14">Save</text>
  <rect x="676" y="350" width="124" height="34" rx="4" fill="#3a3d42" stroke="#676b73"/><text x="696" y="372" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14">Reset Templates</text>
  <rect x="812" y="350" width="94" height="34" rx="4" fill="#3f5f8f" stroke="#7895c8"/><text x="834" y="372" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14">Scan Files</text>
  <rect x="914" y="350" width="132" height="34" rx="4" fill="#3a3d42" stroke="#676b73"/><text x="932" y="372" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14">Select Changeable</text>
  <rect x="1058" y="350" width="112" height="34" rx="4" fill="#303236" stroke="#484b50"/><text x="1082" y="372" fill="#8e949b" font-family="Segoe UI, Arial" font-size="14">Apply Selected</text>
  <text x="582" y="440" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Grouped actions make the path through the tool visible.</text>
  <text x="582" y="468" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Disabled actions show what is not safe yet.</text>
</svg>
