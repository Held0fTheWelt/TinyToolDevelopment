<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Restore and startup preset behavior</title>
  <desc id="desc">Diagram showing one-level restore snapshot and deferred editor startup preset application.</desc>
  <rect width="1120" height="560" fill="#fbfaf7"/>
  <rect x="58" y="52" width="1004" height="456" rx="8" fill="#ffffff" stroke="#d7d0c4"/>
  <text x="92" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#2f2b24">Restore Previous and Startup Preset</text>
  <text x="92" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#645f55">Two safety-oriented flows for predictable editor work.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="92" y="178" width="438" height="244" rx="8" fill="#f0f6ff" stroke="#8eb0d7"/>
    <text x="124" y="218" font-size="20" font-weight="700" fill="#1e426b">Apply flow</text>
    <circle cx="132" cy="260" r="14" fill="#2f74b5"/>
    <text x="132" y="265" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
    <text x="162" y="265" font-size="14" fill="#314b63">Capture scalability and touched CVar values</text>
    <circle cx="132" cy="310" r="14" fill="#2f74b5"/>
    <text x="132" y="315" text-anchor="middle" font-size="13" fill="#ffffff">2</text>
    <text x="162" y="315" font-size="14" fill="#314b63">Apply selected preset</text>
    <circle cx="132" cy="360" r="14" fill="#2f74b5"/>
    <text x="132" y="365" text-anchor="middle" font-size="13" fill="#ffffff">3</text>
    <text x="162" y="365" font-size="14" fill="#314b63">Restore previous once if needed</text>
    <rect x="592" y="178" width="438" height="244" rx="8" fill="#f5f1ff" stroke="#ae99d7"/>
    <text x="624" y="218" font-size="20" font-weight="700" fill="#503776">Startup flow</text>
    <circle cx="632" cy="260" r="14" fill="#7558b0"/>
    <text x="632" y="265" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
    <text x="662" y="265" font-size="14" fill="#55496c">Settings store a soft preset reference</text>
    <circle cx="632" cy="310" r="14" fill="#7558b0"/>
    <text x="632" y="315" text-anchor="middle" font-size="13" fill="#ffffff">2</text>
    <text x="662" y="315" font-size="14" fill="#55496c">Editor engine finishes initialization</text>
    <circle cx="632" cy="360" r="14" fill="#7558b0"/>
    <text x="632" y="365" text-anchor="middle" font-size="13" fill="#ffffff">3</text>
    <text x="662" y="365" font-size="14" fill="#55496c">Preset loads and applies through same applier</text>
  </g>
</svg>

