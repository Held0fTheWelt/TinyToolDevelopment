<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Performance Preset Wizard workflow overview</title>
  <desc id="desc">Diagram showing preset discovery, review, apply, restore, and startup preset configuration.</desc>
  <rect width="1120" height="560" fill="#f7f9fb"/>
  <rect x="54" y="52" width="1012" height="456" rx="8" fill="#ffffff" stroke="#ccd5df"/>
  <text x="86" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2933">Performance Preset Wizard</text>
  <text x="86" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#536171">Editor workflow from asset discovery to reversible apply.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="88" y="184" width="176" height="116" rx="8" fill="#e7f0fb" stroke="#7ca5d8"/>
    <text x="176" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#173b66">Discover</text>
    <text x="176" y="250" text-anchor="middle" font-size="13" fill="#244b73">Asset registry scans</text>
    <text x="176" y="270" text-anchor="middle" font-size="13" fill="#244b73">PerformancePresetAsset</text>
    <rect x="330" y="184" width="176" height="116" rx="8" fill="#eaf7ee" stroke="#82bf91"/>
    <text x="418" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#1f5130">Review</text>
    <text x="418" y="250" text-anchor="middle" font-size="13" fill="#2f6540">Display name</text>
    <text x="418" y="270" text-anchor="middle" font-size="13" fill="#2f6540">Scalability and CVars</text>
    <rect x="572" y="184" width="176" height="116" rx="8" fill="#fff2d9" stroke="#e3b45f"/>
    <text x="660" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#6b4508">Apply</text>
    <text x="660" y="250" text-anchor="middle" font-size="13" fill="#7a561b">Capture restore point</text>
    <text x="660" y="270" text-anchor="middle" font-size="13" fill="#7a561b">Set quality and CVars</text>
    <rect x="814" y="184" width="176" height="116" rx="8" fill="#f5eafb" stroke="#b893d5"/>
    <text x="902" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#54306d">Restore</text>
    <text x="902" y="250" text-anchor="middle" font-size="13" fill="#68447d">Return to previous</text>
    <text x="902" y="270" text-anchor="middle" font-size="13" fill="#68447d">scalability and CVars</text>
    <path d="M264 242 L330 242" stroke="#627080" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M506 242 L572 242" stroke="#627080" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M748 242 L814 242" stroke="#627080" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="208" y="366" width="704" height="70" rx="8" fill="#eef3f7" stroke="#b9c5d0"/>
    <text x="560" y="395" text-anchor="middle" font-size="17" font-weight="700" fill="#283747">Optional startup preset</text>
    <text x="560" y="420" text-anchor="middle" font-size="13" fill="#536171">Project Settings stores a soft preset reference and applies it after editor engine initialization.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#627080"/>
    </marker>
  </defs>
</svg>

