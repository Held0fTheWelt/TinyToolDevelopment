<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Preset authoring fields</title>
  <desc id="desc">Diagram showing metadata, quality dropdowns, and bulk CVar text editor for a performance preset asset.</desc>
  <rect width="1120" height="560" fill="#f8faf7"/>
  <rect x="60" y="44" width="1000" height="472" rx="8" fill="#ffffff" stroke="#cfd8d0"/>
  <text x="90" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#243526">PerformancePresetAsset</text>
  <text x="90" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a695d">Readable asset schema for shared performance profiles.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="92" y="168" width="270" height="250" rx="8" fill="#edf5ff" stroke="#8bb2df"/>
    <text x="120" y="204" font-size="18" font-weight="700" fill="#183d68">Preset metadata</text>
    <text x="120" y="242" font-size="14" fill="#274f78">Display Name</text>
    <rect x="120" y="254" width="210" height="28" rx="4" fill="#ffffff" stroke="#b5c6d8"/>
    <text x="130" y="274" font-size="13" fill="#64748b">Desktop Mid Range</text>
    <text x="120" y="314" font-size="14" fill="#274f78">Description</text>
    <rect x="120" y="326" width="210" height="58" rx="4" fill="#ffffff" stroke="#b5c6d8"/>
    <text x="130" y="351" font-size="13" fill="#64748b">Target, intent, risks</text>
    <rect x="426" y="168" width="270" height="250" rx="8" fill="#eef9f0" stroke="#93c89b"/>
    <text x="454" y="204" font-size="18" font-weight="700" fill="#20542a">Scalability</text>
    <text x="454" y="238" font-size="13" fill="#35633d">0 Low, 1 Medium, 2 High,</text>
    <text x="454" y="258" font-size="13" fill="#35633d">3 Epic, 4 Cinematic</text>
    <rect x="454" y="286" width="214" height="34" rx="4" fill="#ffffff" stroke="#b7d2bc"/>
    <text x="470" y="308" font-size="13" fill="#46534a">Shadows: High</text>
    <rect x="454" y="334" width="214" height="34" rx="4" fill="#ffffff" stroke="#b7d2bc"/>
    <text x="470" y="356" font-size="13" fill="#46534a">GI: Medium</text>
    <rect x="760" y="168" width="270" height="250" rx="8" fill="#fff6e6" stroke="#dfbd79"/>
    <text x="788" y="204" font-size="18" font-weight="700" fill="#62440f">CVar overrides</text>
    <rect x="788" y="230" width="214" height="132" rx="4" fill="#ffffff" stroke="#d7c19a"/>
    <text x="802" y="258" font-size="13" fill="#6b7280">r.ScreenPercentage=85</text>
    <text x="802" y="284" font-size="13" fill="#6b7280">r.Nanite=1</text>
    <text x="802" y="310" font-size="13" fill="#6b7280">r.Shadow.Virtual.Enable=1</text>
    <text x="802" y="336" font-size="13" fill="#6b7280">r.ProfileGPU.ShowUI=0,editor</text>
    <text x="788" y="388" font-size="13" fill="#73541d">Comments and blank lines supported.</text>
  </g>
</svg>

