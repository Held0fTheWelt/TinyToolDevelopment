    <text x="905" y="370" fill="#c3ccd8" font-size="17">Presets</text>
    <text x="905" y="404" fill="#c3ccd8" font-size="17">CI policy</text>
    <rect x="905" y="455" width="240" height="58" rx="9" fill="#3b293f" stroke="#d990ff"/>
    <text x="957" y="491" fill="#f1d9ff" font-size="18" font-weight="700">Shipping Guard</text>
  </g>
  <path d="M410 370 H475" stroke="#7d8794" stroke-width="4" stroke-linecap="round"/>
  <path d="M805 370 H870" stroke="#7d8794" stroke-width="4" stroke-linecap="round"/>
