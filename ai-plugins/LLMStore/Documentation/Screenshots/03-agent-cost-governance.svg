<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LLM Store Agents, Costs, and Governance</title>
  <desc id="desc">Diagram showing agent authentication, cost tracking, and governance outputs.</desc>
  <rect width="1280" height="720" fill="#111318"/>
  <text x="80" y="90" fill="#f5f7fb" font-family="Segoe UI, Arial" font-size="34" font-weight="700">Agents, Costs, Governance</text>
  <text x="80" y="126" fill="#aeb7c5" font-family="Segoe UI, Arial" font-size="18">LLM Store keeps integrations visible and measurable without owning every downstream tool.</text>
  <g font-family="Segoe UI, Arial">
    <rect x="80" y="175" width="330" height="390" rx="14" fill="#202630" stroke="#46566c"/>
    <text x="115" y="225" fill="#ffffff" font-size="26" font-weight="700">Agent Integration</text>
    <text x="115" y="268" fill="#c3ccd8" font-size="17">Status</text>
    <text x="115" y="302" fill="#c3ccd8" font-size="17">Authentication dialog</text>
    <text x="115" y="336" fill="#c3ccd8" font-size="17">Capabilities</text>
    <text x="115" y="370" fill="#c3ccd8" font-size="17">File write policy</text>
    <text x="115" y="404" fill="#c3ccd8" font-size="17">Shell execution policy</text>
    <rect x="115" y="455" width="240" height="58" rx="9" fill="#263a2f" stroke="#59d98f"/>
    <text x="145" y="491" fill="#d9ffe8" font-size="18" font-weight="700">Codex / Claude / Cursor</text>
    <rect x="475" y="175" width="330" height="390" rx="14" fill="#202630" stroke="#46566c"/>
    <text x="510" y="225" fill="#ffffff" font-size="26" font-weight="700">Cost Tracking</text>
    <text x="510" y="268" fill="#c3ccd8" font-size="17">Audit events</text>
    <text x="510" y="302" fill="#c3ccd8" font-size="17">Token usage</text>
    <text x="510" y="336" fill="#c3ccd8" font-size="17">Cost rules</text>
    <text x="510" y="370" fill="#c3ccd8" font-size="17">Provider breakdown</text>
    <text x="510" y="404" fill="#c3ccd8" font-size="17">CSV export</text>
    <rect x="510" y="455" width="240" height="58" rx="9" fill="#3a3324" stroke="#ffc857"/>
    <text x="563" y="491" fill="#fff0c2" font-size="18" font-weight="700">Route Cost Report</text>
    <rect x="870" y="175" width="330" height="390" rx="14" fill="#202630" stroke="#46566c"/>
    <text x="905" y="225" fill="#ffffff" font-size="26" font-weight="700">Governance</text>
    <text x="905" y="268" fill="#c3ccd8" font-size="17">Build rules</text>
